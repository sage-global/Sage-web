<svg width="100%" height="100%" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111E"/>
      <stop offset="50%" stop-color="#0B1A2F"/>
      <stop offset="100%" stop-color="#050C17"/>
    </linearGradient>

    <!-- Brand Color Gradients -->
    <linearGradient id="sageBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006AAD"/>
      <stop offset="50%" stop-color="#35A9EF"/>
      <stop offset="100%" stop-color="#FB6B31"/>
    </linearGradient>

    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB6B31"/>
      <stop offset="100%" stop-color="#FF9E67"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006AAD"/>
      <stop offset="100%" stop-color="#35A9EF"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#35A9EF" fill-opacity="0.3"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes waveScroll {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -720; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.04); }
      }
      @keyframes floatHex {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(2deg); }
      }
      @keyframes sweepLight {
        0% { transform: translateX(-300px); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateX(950px); opacity: 0; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .rf-wave-1 {
        stroke-dasharray: 12 6;
        animation: waveScroll 18s linear infinite;
      }
      .rf-wave-2 {
        stroke-dasharray: 8 4;
        animation: waveScroll 12s linear infinite reverse;
      }
      .pulse-node {
        transform-origin: center;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .floating-logo {
        transform-origin: 760px 130px;
        animation: floatHex 6s ease-in-out infinite;
      }
      .cursor {
        animation: cursorBlink 1.1s infinite;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Manrope', Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="260" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="260" rx="16" fill="url(#grid)"/>
  
  <!-- Outer Accent Border -->
  <rect x="1" y="1" width="898" height="258" rx="15" fill="none" stroke="url(#sageBlueGrad)" stroke-width="1.5" stroke-opacity="0.75"/>

  <!-- Ambient Glow Cones -->
  <circle cx="80" cy="40" r="120" fill="#006AAD" opacity="0.22" filter="blur(40px)"/>
  <circle cx="780" cy="130" r="110" fill="#FB6B31" opacity="0.18" filter="blur(45px)"/>
  <circle cx="450" cy="240" r="140" fill="#35A9EF" opacity="0.12" filter="blur(50px)"/>

  <!-- Background RF Sine Waves (Electromagnetic signals) -->
  <path class="rf-wave-1" d="M 0 190 Q 75 160, 150 190 T 300 190 T 450 190 T 600 190 T 750 190 T 900 190" fill="none" stroke="#35A9EF" stroke-width="2" stroke-opacity="0.35"/>
  <path class="rf-wave-2" d="M 0 210 Q 90 235, 180 210 T 360 210 T 540 210 T 720 210 T 900 210" fill="none" stroke="#FB6B31" stroke-width="2.2" stroke-opacity="0.4" filter="url(#glowOrange)"/>
  <path d="M 0 200 Q 60 170, 120 200 T 240 200 T 360 200 T 480 200 T 600 200 T 720 200 T 840 200 T 900 200" fill="none" stroke="#006AAD" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Top Pill Badge -->
  <g transform="translate(48, 38)">
    <rect width="258" height="28" rx="14" fill="#0E243F" stroke="#35A9EF" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="14" r="4" fill="#FB6B31" class="pulse-node" filter="url(#glowOrange)"/>
    <text x="28" y="18" fill="#35A9EF" font-size="11" font-weight="700" letter-spacing="1.5" class="font-sans">APPLIED ELECTROMAGNETICS</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(48, 106)">
    <text class="font-sans" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      SHASTRY ASSOCIATES
    </text>
    <text x="430" y="0" class="font-sans" font-size="34" font-weight="800" fill="#FB6B31" letter-spacing="-0.5" filter="url(#glowOrange)">
      (SAGE)
    </text>
  </g>

  <!-- Subtitle / Tagline -->
  <g transform="translate(48, 138)">
    <text class="font-sans" font-size="15.5" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      Radio Frequency • Microwave • Antennas • Wireless Systems Engineering
    </text>
  </g>

  <!-- Interactive Terminal/Console Line -->
  <g transform="translate(48, 175)">
    <rect width="520" height="34" rx="8" fill="#0B1624" stroke="#1E293B" stroke-width="1"/>
    <!-- Terminal dots -->
    <circle cx="16" cy="17" r="4" fill="#FB6B31"/>
    <circle cx="28" cy="17" r="4" fill="#35A9EF"/>
    <circle cx="40" cy="17" r="4" fill="#10B981"/>
    
    <text x="56" y="22" fill="#35A9EF" font-size="12" font-weight="700" class="font-mono">sage:~$</text>
    <text x="115" y="22" fill="#E2E8F0" font-size="12" font-weight="500" class="font-mono">
      bridging graduate theory with the industrial lab bench
    </text>
    <rect x="525" y="11" width="7" height="13" fill="#FB6B31" class="cursor"/>
  </g>

  <!-- SAGE Right Geometric Hexagon Emblem & Radar Compass -->
  <g class="floating-logo" transform="translate(740, 118)">
    <!-- Outer radar rings -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#35A9EF" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#006AAD" stroke-width="1.2" stroke-opacity="0.4"/>
    
    <!-- Crosshairs -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#35A9EF" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2 4"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#35A9EF" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2 4"/>

    <!-- Glowing Hexagon Background -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="#0C2038" stroke="url(#orangeGlow)" stroke-width="2.5" filter="url(#glowOrange)"/>
    
    <!-- Inner Hexagon Accent -->
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="none" stroke="#35A9EF" stroke-width="1.5" stroke-opacity="0.8"/>
    
    <!-- Center SAGE Monogram Icon -->
    <text x="0" y="9" text-anchor="middle" font-family="'Segoe UI', 'Manrope', sans-serif" font-size="23" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      S
    </text>
    <circle cx="0" cy="0" r="2" fill="#FB6B31" filter="url(#glowOrange)"/>
  </g>

  <!-- Bottom Spectrum Indicator Line -->
  <line x1="48" y1="234" x2="852" y2="234" stroke="url(#sageBlueGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
